name: CI

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - 'harbor_helper.Containerfile'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - 'harbor_helper.Containerfile'
      - '.github/workflows/ci.yaml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: make install-dev

      - name: Lint and Format check
        run: make check

      - name: Run tests
        run: make test

      - name: Build package
        run: make build

      - name: Build OCI Image
        run: make image-build CONTAINER_CLI=docker

      - name: Verify build artifacts
        run: ls -l dist/
