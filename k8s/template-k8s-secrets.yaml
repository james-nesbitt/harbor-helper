# Template for harbor-helper secrets (NFR 4).
# Create the real secret using:
# kubectl create secret generic harbor-helper-secrets \
#   --from-literal=HARBOR_HELPER_APPROVED_ENGINEERS="user1,user2" \
#   --from-literal=SLACK_BOT_TOKEN="xoxb-..." \
#   --from-literal=SLACK_APP_TOKEN="xapp-..." \
#   --from-literal=OPENAI_API_KEY="sk-..." \
#   --from-literal=JIRA_TOKEN="your-atlassian-api-token" \
#   --from-literal=JIRA_USERNAME="user@example.com"

apiVersion: v1
kind: Secret
metadata:
  name: harbor-helper-secrets
type: Opaque
data:
  # Base64 encoded values go here
  HARBOR_HELPER_APPROVED_ENGINEERS: dXNlcjEsdXNlcjI=
