[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harbor-helper"
version = "0.1.0"
description = "LLM-assisted change requests for Harbor OCI registries (projects and robot accounts)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harbor Helper Contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai>=1.0.0",
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.20.0",
    "atlassian-python-api>=3.41.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "pytest-mock>=3.10",
    "ruff>=0.1.0",
]

[project.scripts]
harbor-helper = "harbor_helper.main:main"
harbor-helper-local = "harbor_helper.local_tool:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "ollama: tests that require a running Ollama instance (skipped by default)",
]

[tool.coverage.run]
source = ["src/harbor_helper"]
branch = true
